<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Console d'animation — proposition A « pupitre » : l'écran du scénario (pistes + tête de lecture) et la table de régie. -->
  <g stroke="#000" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- Écran -->
    <rect x="60" y="28" width="392" height="252" rx="30" fill="#f5f2ef"/>
    <rect x="92" y="60" width="328" height="188" rx="12" fill="#1e90ff" stroke-width="12"/>
    <!-- Pistes du scénario -->
    <rect x="114" y="86" width="118" height="28" rx="14" fill="#7ed957" stroke-width="10"/>
    <rect x="186" y="134" width="150" height="28" rx="14" fill="#ffa726" stroke-width="10"/>
    <rect x="140" y="182" width="104" height="28" rx="14" fill="#ff4757" stroke-width="10"/>
    <rect x="300" y="182" width="96" height="28" rx="14" fill="#f5f2ef" stroke-width="10"/>
    <!-- Tête de lecture -->
    <line x1="270" y1="74" x2="270" y2="234" stroke="#fff" stroke-width="8"/>
    <path d="M254 70 h32 l-16 18 z" fill="#fff" stroke="#fff" stroke-width="6"/>
    <!-- Pied -->
    <rect x="224" y="280" width="64" height="40" fill="#c3c8d8"/>
    <!-- Table de régie -->
    <path d="M58 320 H454 Q468 320 472 334 L494 462 Q497 484 474 484 H38 Q15 484 18 462 L40 334 Q44 320 58 320 Z" fill="#e6e1dc"/>
    <!-- Curseurs -->
    <line x1="112" y1="356" x2="112" y2="452" stroke-width="10"/>
    <line x1="182" y1="356" x2="182" y2="452" stroke-width="10"/>
    <line x1="252" y1="356" x2="252" y2="452" stroke-width="10"/>
    <rect x="88" y="376" width="48" height="26" rx="6" fill="#ff4757" stroke-width="10"/>
    <rect x="158" y="414" width="48" height="26" rx="6" fill="#7ed957" stroke-width="10"/>
    <rect x="228" y="362" width="48" height="26" rx="6" fill="#ffa726" stroke-width="10"/>
    <!-- Boutons rotatifs et touches -->
    <circle cx="340" cy="378" r="24" fill="#1e90ff" stroke-width="10"/>
    <line x1="340" y1="378" x2="340" y2="360" stroke-width="8"/>
    <circle cx="414" cy="378" r="24" fill="#1e90ff" stroke-width="10"/>
    <line x1="414" y1="378" x2="428" y2="366" stroke-width="8"/>
    <circle cx="340" cy="440" r="14" fill="#7ed957" stroke-width="10"/>
    <circle cx="414" cy="440" r="14" fill="#ff4757" stroke-width="10"/>
  </g>
</svg>

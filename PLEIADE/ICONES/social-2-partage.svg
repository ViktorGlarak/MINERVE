<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Social — proposition 2 « aimer et repartager » : les deux gestes propres à un réseau social, absents d'une messagerie — la boucle de repartage (violet, la couleur déjà associée à Social) qui enserre un cœur. Aucune bulle : se distingue de la messagerie au premier coup d'œil. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Couche noire : contour de la boucle (bande de 52 + 16 de trait de chaque côté) -->
    <g stroke="#000" fill="#000">
      <path d="M360 120 H140 Q96 120 96 164 V262" fill="none" stroke-width="84"/>
      <path d="M152 392 H372 Q416 392 416 348 V250" fill="none" stroke-width="84"/>
      <path d="M36 262 H156 L96 336 Z" stroke-width="32"/>
      <path d="M476 250 H356 L416 176 Z" stroke-width="32"/>
    </g>
    <!-- Couche violette : la boucle de repartage -->
    <g stroke="#6364ff" fill="#6364ff">
      <path d="M360 120 H140 Q96 120 96 164 V262" fill="none" stroke-width="52"/>
      <path d="M152 392 H372 Q416 392 416 348 V250" fill="none" stroke-width="52"/>
      <path d="M36 262 H156 L96 336 Z" stroke="none"/>
      <path d="M476 250 H356 L416 176 Z" stroke="none"/>
    </g>
    <!-- Cœur -->
    <path d="M256 311 C239 299 195 270 195 239 C195 219 210 205 227 205 C241 205 251 214 256 224 C261 214 271 205 285 205 C302 205 317 219 317 239 C317 270 273 299 256 311 Z" fill="#ff4757" stroke="#000" stroke-width="16"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Social — proposition 3 « publication » : la carte d'un post, son avatar rond (violet, couleur de Social) qui déborde en haut à gauche et le cœur qui réagit en bas à droite. L'avatar rond et le cœur la distinguent de la presse (page carrée) et de la messagerie (bulles). -->
  <defs>
    <clipPath id="social3-av"><circle cx="112" cy="128" r="64"/></clipPath>
  </defs>
  <g stroke="#000" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- Carte de la publication -->
    <rect x="96" y="112" width="320" height="288" rx="40" fill="#f5f2ef"/>
    <!-- Nom et identifiant -->
    <line x1="216" y1="160" x2="372" y2="160"/>
    <line x1="216" y1="200" x2="316" y2="200" stroke-width="12"/>
    <!-- Texte du post -->
    <line x1="136" y1="256" x2="376" y2="256" stroke-width="12"/>
    <line x1="136" y1="300" x2="300" y2="300" stroke-width="12"/>
    <line x1="136" y1="344" x2="256" y2="344" stroke-width="12"/>
    <!-- Avatar -->
    <circle cx="112" cy="128" r="72" fill="#6364ff" stroke="none"/>
    <g clip-path="url(#social3-av)" fill="#f5f2ef" stroke-width="12">
      <circle cx="112" cy="108" r="24"/>
      <path d="M66 220 V186 Q66 144 112 144 Q158 144 158 186 V220 Z"/>
    </g>
    <circle cx="112" cy="128" r="72" fill="none"/>
    <!-- Réaction : cœur -->
    <path d="M400 452 C380 438 328 404 328 368 C328 344 346 328 366 328 C382 328 394 338 400 350 C406 338 418 328 434 328 C454 328 472 344 472 368 C472 404 420 438 400 452 Z" fill="#ff4757"/>
  </g>
</svg>
